# No [build-system], no [project] -> uv won't try to build your code.
# It will only create a venv and install these dependencies.

[project]
name = "jmod"
version = "2.0.0"
requires-python = ">=3.14.3"

[tool.uv]
required-version = ">=0.13"
managed = true
default-groups = ["deps"]

required-environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[tool.uv.sources]
# Free-threaded polars-runtime-32, repacked from conda-forge:
# https://github.com/ParallelSquared/jmod-polars-mirror
polars-runtime-32 = [
  { url = "https://github.com/ParallelSquared/jmod-polars-mirror/releases/download/v1.44.2/polars_runtime_32-1.44.2-cp314-cp314t-win_amd64.whl", marker = "sys_platform == 'win32' and platform_machine == 'AMD64'" },
  { url = "https://github.com/ParallelSquared/jmod-polars-mirror/releases/download/v1.44.2/polars_runtime_32-1.44.2-cp314-cp314t-macosx_11_0_arm64.whl", marker = "sys_platform == 'darwin' and platform_machine == 'arm64'" },
  { url = "https://github.com/ParallelSquared/jmod-polars-mirror/releases/download/v1.44.2/polars_runtime_32-1.44.2-cp314-cp314t-macosx_11_0_x86_64.whl", marker = "sys_platform == 'darwin' and platform_machine == 'x86_64'" },
  { url = "https://github.com/ParallelSquared/jmod-polars-mirror/releases/download/v1.44.2/polars_runtime_32-1.44.2-cp314-cp314t-manylinux_2_17_x86_64.manylinux2014_x86_64.whl", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
  { url = "https://github.com/ParallelSquared/jmod-polars-mirror/releases/download/v1.44.2/polars_runtime_32-1.44.2-cp314-cp314t-manylinux_2_17_aarch64.manylinux2014_aarch64.whl", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" },
]

[dependency-groups]
deps = [
  # Core
  "numpy",
  "scipy",
  "dill",
  "pandas",
  "numba",
  "pymzml",
  "mzmlpy",
  "psims",
  "lxml",
  "regex",
  "tqdm",
  "peppy_sage>=0.2.0",

  # Visualization
  "matplotlib",
  "seaborn",
  "plotly",
  "matplotlib-venn",
  "upsetplot",
  "pillow",

  # Data engineering / IO
  "pyarrow<26.0.0",
  # polars-runtime-32 is polars' compiled half; PyPI has no free-threaded build,
  # so it comes from jmod-polars-mirror (see [tool.uv.sources]).  polars needs
  # it at its own exact version: bump the two, and the URLs, together.
  "polars==1.44.2",
  "polars-runtime-32==1.44.2",

  # Classical ML / stats
  "scikit-learn",
  "xgboost",
  "statsmodels",
  "joblib",

  # Profiling & perf tools
  "line-profiler",
  "memory-profiler",
  "pyinstrument",

  # GUI (Tk themes)
  "sv-ttk",
  "ttkthemes",

  # OS-specific helper
  "pywin32; platform_system == 'Windows'",
  "pythonnet",

  # Retention-time prediction
  "jrif>=0.2.0",
  # torch<2.11: from 2.11 torch's bundled libomp has install name
  # /opt/llvm-openmp/lib/libomp.dylib instead of Homebrew's path, so on
  # macOS/arm64 dyld loads it as a SECOND OpenMP runtime alongside the one
  # xgboost uses and the next threaded call segfaults.  With <2.11 the install
  # names match and dyld loads one image.  See src/__init__.py and
  # pytorch/pytorch#155201.
  "torch<2.11",

  # Testing
  "pytest",
  "pytest-cov"
]

[tool.coverage.run]
omit = [
    "src/run_jmod_from_GUI.py",
    "src/utils/gui_utils.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
