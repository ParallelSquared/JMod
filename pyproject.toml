# No [build-system], no [project] -> uv won't try to build your code.
# It will only create a venv and install these dependencies.

[project]
name = "jmod"
version = "2.0.0"
requires-python = ">=3.11,<3.12"

[tool.uv]
managed = true
default-groups = ["deps"]

required-environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[dependency-groups]
deps = [
  # Core
  "numpy",
  "scipy",
  "dill",
  "pandas",
  "numba",
  "pyteomics",
  "pymzml",
  "psims",
  "brain-isotopic-distribution",
  "biosaur2",
  "lxml",
  "regex",
  "tqdm",
  "peppy_sage>=0.2.0",

  # Visualization
  "matplotlib",
  "seaborn",
  "plotly",
  "matplotlib-venn",
  "upsetplot",
  "pillow",

  # Data engineering / IO
  "pyarrow<26.0.0",
  "polars<2.0.0",

  # Classical ML / stats
  "scikit-learn",
  "xgboost",
  "statsmodels",
  "joblib",

  # Optimization / math extras
  "cvxopt",
  "ptinnls",

  # Profiling & perf tools
  "line-profiler",
  "memory-profiler",
  "pyinstrument",

  # GUI (Qt + optional Tk themes)
  "PySide6",
  "shiboken6",
  "sv-ttk",
  "ttkthemes",

  # OS-specific helper
  "pywin32; platform_system == 'Windows'",
  "pythonnet",

  # Retention-time prediction
  "jrif>=0.2.0",
  # torch<2.11: from 2.11 torch's bundled libomp has install name
  # /opt/llvm-openmp/lib/libomp.dylib instead of Homebrew's path, so on
  # macOS/arm64 dyld loads it as a SECOND OpenMP runtime alongside the one
  # xgboost uses and the next threaded call segfaults.  With <2.11 the install
  # names match and dyld loads one image.  See src/__init__.py and
  # pytorch/pytorch#155201.
  "torch<2.11",

  # Testing
  "pytest",
  "pytest-cov"
]
dev = [
    "pyside6<6.8",
]

[tool.coverage.run]
omit = [
    "src/run_jmod_from_GUI.py",
    "src/utils/gui_utils.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
